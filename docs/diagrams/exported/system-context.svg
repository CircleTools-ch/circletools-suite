<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>C4 System Context — Suite App-Suite</title>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">System Context — &lt;Suite&gt; App-Suite (pre-rendered sample)</text>

  <!-- Person -->
  <rect x="300" y="52" width="120" height="60" rx="6" fill="#08427b" stroke="#052e56"/>
  <text x="360" y="78" text-anchor="middle" fill="#ffffff" font-weight="bold">Family / friend</text>
  <text x="360" y="96" text-anchor="middle" fill="#ccd8e6" font-size="11">[Person]</text>

  <!-- Suite boundary -->
  <rect x="120" y="150" width="480" height="150" rx="8" fill="none" stroke="#7f8c8d" stroke-dasharray="6 4"/>
  <text x="132" y="168" fill="#7f8c8d" font-size="11">&lt;Suite&gt; App-Suite</text>

  <!-- Clients -->
  <rect x="150" y="185" width="180" height="80" rx="6" fill="#1168bd" stroke="#0b4884"/>
  <text x="240" y="212" text-anchor="middle" fill="#ffffff" font-weight="bold">Apps (Web + native)</text>
  <text x="240" y="232" text-anchor="middle" fill="#d6e4f3" font-size="11">Blazor / MAUI Hybrid</text>
  <text x="240" y="248" text-anchor="middle" fill="#d6e4f3" font-size="11">local-first + optional sync</text>

  <!-- API -->
  <rect x="390" y="185" width="180" height="80" rx="6" fill="#1168bd" stroke="#0b4884"/>
  <text x="480" y="212" text-anchor="middle" fill="#ffffff" font-weight="bold">Web API</text>
  <text x="480" y="232" text-anchor="middle" fill="#d6e4f3" font-size="11">.NET 10 / Aspire</text>
  <text x="480" y="248" text-anchor="middle" fill="#d6e4f3" font-size="11">sync, account, config</text>

  <!-- DB -->
  <rect x="390" y="330" width="180" height="56" rx="6" fill="#2e7d32" stroke="#1b5e20"/>
  <text x="480" y="355" text-anchor="middle" fill="#ffffff" font-weight="bold">PostgreSQL</text>
  <text x="480" y="372" text-anchor="middle" fill="#d7ead8" font-size="11">[Database]</text>

  <!-- External IdP -->
  <rect x="600" y="185" width="110" height="80" rx="6" fill="#999999" stroke="#6e6e6e"/>
  <text x="655" y="218" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="12">Identity /</text>
  <text x="655" y="234" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="12">passkeys</text>

  <!-- Relationships -->
  <line x1="360" y1="112" x2="240" y2="185" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="225" x2="390" y2="225" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="265" x2="480" y2="330" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="225" x2="600" y2="225" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="292" y="150" text-anchor="middle" fill="#4a4a4a" font-size="11">uses</text>
  <text x="360" y="219" text-anchor="middle" fill="#4a4a4a" font-size="11">sync</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a4a4a"/>
    </marker>
  </defs>
</svg>
