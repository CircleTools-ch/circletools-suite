# Deployment to the Infomaniak VPS (ADR-0036 / ADR-0038 CD half / ADR-0047 versioning).
#
# Runs ONLY on manual dispatch (ADR-0047 amendment 2026-10-28): a docs-only or mobile-only merge no longer rolls
# the server. Still only green commits ship: a build run first checks that CI succeeded for the commit (main's
# tip), and refuses otherwise. A dispatch with an image_tag is a rollback to an existing image. Every run:
#   1. computes the suite version from git (nbgv, ADR-0047: 0.1.<git-height>),
#   2. builds the API + Web images, stamped with that version, and pushes them to GHCR tagged
#      :<version>, :<commit-sha>, and :latest,
#   3. rolls the VPS forward over SSH (migrator, then `compose up`).
#
# The rollout job runs in the `production` environment (ADR-0093): the owner approves every rollout, and
# the DEPLOY_* secrets live in that environment, out of reach of any other job or workflow. If they are
# missing, the job fails with a clear message instead of skipping.
#
# Secrets of the `production` environment:
#   DEPLOY_HOST        VPS hostname / IP
#   DEPLOY_USER        SSH user with docker access
#   DEPLOY_SSH_KEY     private key for that user
#   DEPLOY_KNOWN_HOSTS ssh-keyscan output for DEPLOY_HOST (host-key pinning)
# The VM holds deploy/compose.yaml + deploy/.env and pulls images from GHCR.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy (rollback). Leave empty to build & deploy the current commit."
        required: false
        default: ""

# One production rollout at a time; never cancel a rollout in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read # the guard reads the CI result of the commit it is about to build

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/circletools-ch

jobs:
  # Gate + mode selection. With an image_tag the dispatch is a rollback (redeploy an existing image, no rebuild).
  # Without one it builds the dispatched commit — but only if CI succeeded for exactly that commit: the manual
  # trigger replaced the automatic "after green CI" one, and the gate it gave must not go with it.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      ref: ${{ steps.pick.outputs.ref }}
      redeploy_tag: ${{ github.event.inputs.image_tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conclusion="$(gh run list --repo "${{ github.repository }}" --workflow CI --commit "${{ github.sha }}" \
            --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' || true)"
          if [ "$conclusion" != "completed/success" ]; then
            echo "::error::CI has not succeeded for ${{ github.sha }} (${conclusion:-no run}). Wait for CI, or redeploy an existing image_tag."
            exit 1
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build-push:
    name: build & push images
    needs: guard
    if: ${{ needs.guard.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.nbgv.outputs.SimpleVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}
          fetch-depth: 0 # full history: nbgv computes the version from git height (ADR-0047).

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Computes the suite version from version.json + git height. toolVersion pins the nbgv CLI to the
      # same build as the Nerdbank.GitVersioning package (Directory.Packages.props), so the workflow and
      # the in-project stamping never disagree.
      - name: Compute version (nbgv)
        id: nbgv
        uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
        with:
          toolVersion: "3.10.94"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VERSION (SemVer2, clean on main) is stamped into the image assemblies; .git is not in the build
      # context, so the Dockerfiles publish with ContainerBuild=true and this explicit version (ADR-0047).
      - name: Build & push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.nbgv.outputs.SemVer2 }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/circletools-api:${{ steps.nbgv.outputs.SimpleVersion }}
            ${{ env.IMAGE_PREFIX }}/circletools-api:${{ needs.guard.outputs.ref }}
            ${{ env.IMAGE_PREFIX }}/circletools-api:latest

      - name: Build & push Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.nbgv.outputs.SemVer2 }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/circletools-web:${{ steps.nbgv.outputs.SimpleVersion }}
            ${{ env.IMAGE_PREFIX }}/circletools-web:${{ needs.guard.outputs.ref }}
            ${{ env.IMAGE_PREFIX }}/circletools-web:latest

  deploy:
    name: deploy to VPS
    needs: [guard, build-push]
    # Run when the build either succeeded (build mode) or was skipped (rollback mode).
    if: >-
      ${{ always()
        && needs.guard.result == 'success'
        && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Required reviewer + the DEPLOY_* secrets (ADR-0093). Limited to `main` in the environment settings.
    environment: production
    steps:
      - name: Check the deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_HOST / DEPLOY_SSH_KEY are not set in the 'production' environment — see docs/deployment/server-setup.md."
            exit 1
          fi

      # The runner needs the deploy/ tree so it can rsync compose.yaml + observability config to the VM.
      - name: Check out deploy config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.ref }}

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ needs.guard.outputs.build }}" = "true" ]; then
            echo "tag=${{ needs.build-push.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.guard.outputs.redeploy_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync config & roll forward over SSH
        # 1) rsync the compose file + observability config to the VM (so config changes ship with the
        #    deploy — not by hand), 2) pin the deployed IMAGE_TAG in the VM's .env (so a manual
        #    `docker compose` matches the pipeline instead of drifting to a stale :latest), then
        #    3) back up the database (ADR-0087: production data is kept — a failed backup stops the rollout
        #    before anything migrates), 4) migrate as an explicit one-shot and roll the stack forward.
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > key
          mkdir -p ~/.ssh && echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

          # Ship compose.yaml + config + the backup scripts/units. NEVER sync .env (VM-only secrets); NO
          # top-level --delete (it would wipe .env and other VM-only files). Caddyfile is baked into the web
          # image, so it is not synced. The scripts are invoked via `bash` (systemd unit + docs), so a
          # missing exec bit after rsync does not matter.
          rsync -az -e "ssh -i key -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            deploy/compose.yaml deploy/loki deploy/prometheus deploy/grafana deploy/ntfy \
            deploy/backup.sh deploy/restore.sh deploy/notify-failure.sh deploy/systemd \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/circletools/"

          ssh -i key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/circletools && \
             (grep -q '^IMAGE_TAG=' .env && sed -i 's|^IMAGE_TAG=.*|IMAGE_TAG=$TAG|' .env || echo 'IMAGE_TAG=$TAG' >> .env) && \
             IMAGE_TAG=$TAG docker compose pull && \
             BACKUP_TAG=predeploy bash backup.sh && \
             IMAGE_TAG=$TAG docker compose run --rm migrator && \
             IMAGE_TAG=$TAG docker compose up -d --remove-orphans"
