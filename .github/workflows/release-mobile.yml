# Mobile store release for the Secret-Santa app (ADR-0047 hybrid trigger — the store half).
#
# Store releases are deliberate, tagged events (store review + a versionCode that can never repeat),
# unlike the server which deploys continuously on merge (deploy.yml). Pushing a `v*` tag builds the
# signed Android head with:
#   - versionName = the suite SemVer from git (nbgv, ADR-0047), e.g. 0.1.42
#   - versionCode = `git rev-list --count HEAD` — globally monotonic, because nbgv's git height RESETS
#     on a major/minor bump and a store versionCode must strictly increase forever (ADR-0047).
#
# SCAFFOLD — like deploy.yml: it builds and archives the artifact now; the SIGNING and the store upload
# activate once their secrets exist (the ADR-0030 store-account follow-up). No secrets → an unsigned .aab
# (Android) / a simulator compile-check (iOS) is produced for inspection only.
#
# iOS builds on a GitHub-HOSTED macOS runner (ADR-0065, which supersedes ADR-0031's "buy a Mac"): the
# iOS leg rides the same v* tag as Android, staying OUT of the per-push ci.yml gate to keep macOS minutes
# (10x multiplier) near CHF 0 at this release cadence.
#
# Repo secrets (not yet set):
#   Android (ADR-0030):
#     ANDROID_KEYSTORE_BASE64        base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD      keystore password
#     ANDROID_KEY_ALIAS              signing key alias
#     ANDROID_KEY_PASSWORD           signing key password
#     PLAY_SERVICE_ACCOUNT_JSON      Google Play Developer API service-account key (upload leg)
#   iOS (ADR-0065 / ADR-0050) — all producible from the Apple portal + App Store Connect, no local Mac:
#     IOS_DIST_CERT_P12_BASE64       base64 of the Apple Distribution certificate (.p12)
#     IOS_DIST_CERT_PASSWORD         the .p12 export password
#     IOS_PROVISIONING_PROFILE_BASE64  base64 of the App Store distribution profile (.mobileprovision)
#     APPSTORE_ISSUER_ID             App Store Connect API key issuer id (TestFlight upload)
#     APPSTORE_KEY_ID                App Store Connect API key id
#     APPSTORE_API_PRIVATE_KEY       the API key private key (.p8 contents)
name: Release (mobile)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual test build off the current commit

permissions:
  contents: read

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android (Secret-Santa)
    runs-on: windows-latest # matches ci.yml build-maui; the Android head builds with the MAUI workload
    defaults:
      run:
        shell: bash
    env:
      APP: src/Apps/SecretSanta/CircleTools.SecretSanta.App/CircleTools.SecretSanta.App.csproj
      # secrets are not readable in a step-level `if`; surface presence as a job env instead.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: nbgv version + the git-count versionCode (ADR-0047).

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compute version (nbgv)
        id: nbgv
        uses: dotnet/nbgv@v0.5.2
        with:
          toolVersion: "3.10.94"

      # versionCode = total commits on this history. Monotonic as long as main is never rewritten
      # (git-conventions), which a store upload requires.
      - name: Compute versionCode
        id: code
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore MAUI workloads
        run: dotnet workload restore "$APP"

      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Signed release build. versionName from nbgv, versionCode from the git count (both override the
      # csproj local-dev defaults). The signing props are only added when a keystore is present.
      - name: Publish signed Android app bundle
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          dotnet publish "$APP" -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion=${{ steps.nbgv.outputs.SimpleVersion }} \
            -p:ApplicationVersion=${{ steps.code.outputs.value }} \
            -p:RevealBaseUrl=https://secretsanta.circletools.ch \
            -p:ApiBaseUrl=https://api.circletools.ch \
            -p:AndroidPackageFormat=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.jks" \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'

      # No keystore yet: build an UNSIGNED bundle so the pipeline is exercised and the artifact is
      # inspectable. Not uploadable to Play — that waits on the signing secrets (ADR-0030).
      - name: Publish unsigned Android app bundle (scaffold)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: |
          echo "::warning::No ANDROID_KEYSTORE_BASE64 — building an UNSIGNED bundle (not store-uploadable)."
          dotnet publish "$APP" -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion=${{ steps.nbgv.outputs.SimpleVersion }} \
            -p:ApplicationVersion=${{ steps.code.outputs.value }} \
            -p:RevealBaseUrl=https://secretsanta.circletools.ch \
            -p:ApiBaseUrl=https://api.circletools.ch \
            -p:AndroidPackageFormat=aab

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: secretsanta-android-${{ steps.nbgv.outputs.SimpleVersion }}-${{ steps.code.outputs.value }}
          path: "src/Apps/SecretSanta/CircleTools.SecretSanta.App/bin/Release/net10.0-android/**/*.aab"
          if-no-files-found: error
          retention-days: 7

      # --- Play internal-track upload (activates once the signing + Play API secrets exist) ---
      # Requires the app's FIRST release to have been uploaded manually in Play Console once: the Play
      # Developer API cannot create an app's first release, only subsequent ones (ADR-0030 follow-up).
      - name: Locate signed AAB
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_PLAY == 'true' }}
        id: aab
        run: |
          set -euo pipefail
          AAB="$(find src/Apps/SecretSanta/CircleTools.SecretSanta.App/bin/Release/net10.0-android -name '*.aab' | head -1)"
          echo "Found AAB: $AAB"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload to Play internal track
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.circletools.secretsanta
          releaseFiles: ${{ steps.aab.outputs.path }}
          tracks: internal
          status: completed

  ios:
    name: iOS (Secret-Santa)
    # GitHub-HOSTED macOS runner (ADR-0065, supersedes ADR-0031). iOS/MacCatalyst can only build on
    # macOS — the csproj scopes net10.0-ios behind IsOSPlatform('osx'), so it is available here and
    # nowhere else in the pipeline.
    # .NET 10's current servicing band ships an iOS 27.x workload, which REQUIRES Xcode 27 (Apple's
    # autumn-2026 SDK bump, foreseen by ADR-0031/0065). Xcode 27 is not on macos-15 (max 26.3) or
    # macos-26 (max 26.6); it lives on the dedicated `xcode-27` image (macOS 27, arm64, public preview
    # as of 2026-09). Re-check at each .NET/Xcode bump; move to a `macos-NN` label once Xcode 27 is GA
    # there (ADR-0065 hosted-image-lag risk / runner-swap note).
    runs-on: xcode-27
    defaults:
      run:
        shell: bash
    env:
      APP: src/Apps/SecretSanta/CircleTools.SecretSanta.App/CircleTools.SecretSanta.App.csproj
      # secrets are not readable in a step-level `if`; surface presence as a job env instead.
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
      HAS_TESTFLIGHT: ${{ secrets.APPSTORE_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: nbgv version + the git-count build number (ADR-0047).

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compute version (nbgv)
        id: nbgv
        uses: dotnet/nbgv@v0.5.2
        with:
          toolVersion: "3.10.94"

      # iOS CFBundleVersion (build number) = total commits, matching the Android versionCode. Monotonic
      # as long as main is never rewritten (git-conventions), which a store upload requires (ADR-0047).
      - name: Compute build number
        id: code
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore MAUI workloads
        run: dotnet workload restore "$APP"

      # The iOS SDK pack requires EXACTLY the Xcode major.minor it was built against (pack 27.1.x →
      # Xcode 27.1), not just "any 27.x". The pack version follows the SDK pinned in global.json, so a
      # hard-coded Xcode pin broke on every SDK bump; derive it from the restored pack instead. Read the
      # packs folder, not `dotnet workload list`: restore installs `maui-ios`, and the `ios` workload it
      # pulls in is not listed. On a fresh runner the restore is the only source of packs, so the newest
      # net10.0 pack is the one the build uses. If the image lacks that Xcode, setup-xcode fails here
      # with a clear message — then move `runs-on` to an image that has it (ADR-0065 hosted-image-lag risk).
      - name: Read Xcode version required by the iOS SDK pack
        id: xcode
        run: |
          set -euo pipefail
          shopt -s nullglob
          DOTNET_DIR="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}"
          echo "iOS SDK packs in $DOTNET_DIR/packs:"
          for d in "$DOTNET_DIR"/packs/Microsoft.iOS.Sdk.net*/*/; do echo "  $d"; done
          PACK="$(for d in "$DOTNET_DIR"/packs/Microsoft.iOS.Sdk.net10.0_*/*/; do basename "$d"; done \
            | sort -V | tail -n1)"
          [ -n "$PACK" ] || { echo "::error::No Microsoft.iOS.Sdk.net10.0 pack under $DOTNET_DIR/packs"; exit 1; }
          XCODE="$(echo "$PACK" | cut -d. -f1,2)"
          echo "iOS SDK pack $PACK requires Xcode $XCODE"
          echo "version=$XCODE" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      # --- Signed device build → TestFlight (activates once the iOS signing secrets exist) ---

      - name: Install signing certificate & provisioning profile
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/dist.mobileprovision"

          # A dedicated, ephemeral keychain so signing never touches the runner's login keychain.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # Make the profile discoverable by the build tooling.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$RUNNER_TEMP/dist.mobileprovision" "$PROFILES_DIR/"

          # Derive the signing identity and the profile name from the imported material (no extra secret).
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Apple Distribution:[^"]*"' | head -1 | tr -d '"')"
          security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          echo "CODESIGN_KEY=$IDENTITY" >> "$GITHUB_ENV"
          echo "CODESIGN_PROVISION=$PROFILE_NAME" >> "$GITHUB_ENV"

      # Signed .ipa. versionName from nbgv, build number from the git count (both override the csproj
      # local-dev defaults); RevealBaseUrl/ApiBaseUrl baked to production (ADR-0053, matches Android).
      - name: Publish signed iOS app (.ipa)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          dotnet publish "$APP" -c Release -f net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ApplicationDisplayVersion=${{ steps.nbgv.outputs.SimpleVersion }} \
            -p:ApplicationVersion=${{ steps.code.outputs.value }} \
            -p:RevealBaseUrl=https://secretsanta.circletools.ch \
            -p:ApiBaseUrl=https://api.circletools.ch \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$CODESIGN_PROVISION"

      - name: Upload .ipa artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: secretsanta-ios-${{ steps.nbgv.outputs.SimpleVersion }}-${{ steps.code.outputs.value }}
          path: "src/Apps/SecretSanta/CircleTools.SecretSanta.App/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa"
          if-no-files-found: error
          retention-days: 7

      # TestFlight upload — needs BOTH the signed .ipa and the App Store Connect API key.
      - name: Upload to TestFlight
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_TESTFLIGHT == 'true' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: "src/Apps/SecretSanta/CircleTools.SecretSanta.App/bin/Release/net10.0-ios/ios-arm64/publish/CircleTools.SecretSanta.App.ipa"
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # --- Scaffold path: no signing secrets yet. Compile for the SIMULATOR (needs no certificate) so
      #     the pipeline is exercised and iOS build breakage is caught. Produces nothing installable. ---
      - name: Compile-check iOS (simulator, unsigned)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: |
          echo "::warning::No IOS_DIST_CERT_P12_BASE64 — compiling for the simulator only (not signed, not TestFlight-uploadable)."
          dotnet build "$APP" -c Release -f net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:ApplicationDisplayVersion=${{ steps.nbgv.outputs.SimpleVersion }} \
            -p:ApplicationVersion=${{ steps.code.outputs.value }} \
            -p:RevealBaseUrl=https://secretsanta.circletools.ch \
            -p:ApiBaseUrl=https://api.circletools.ch
