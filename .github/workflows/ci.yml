# Continuous integration gate for the CircleTools suite (ADR-0038).
# Build under analyzers (warnings-as-errors), run the full test suite, and build the
# link-checked DocFX site on every push and PR to main. The MAUI Android head builds on a Windows
# runner; iOS builds on macOS in release-mobile.yml only (ADR-0065). To save Actions minutes, the
# expensive jobs (build-maui at the 2x Windows rate, webauthn-e2e) skip docs-only changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Newer pushes to the same branch/PR cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the tree changed. The expensive jobs (the 2x Windows MAUI build and the long WebAuthn
  # E2E) consult this so a docs-only commit skips them. They stay on BOTH push and PR, so a direct push
  # to main is still gated (ADR-0038). Fails OPEN: if detection is unsure it reports changed, so a job is
  # never wrongly skipped. (To move the expensive jobs to PR-only instead — valid only if every change
  # reaches main through a PR — add `github.event_name == 'pull_request' &&` to each job's `if`.)
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.slnx'
              - 'global.json'
              - '.config/dotnet-tools.json'
              - '.github/workflows/**'

  # Secret scan of the full history on every push and PR (ADR-0093). Uses the repository's .gitleaks.toml,
  # which allow-lists only reviewed non-secrets. The binary is downloaded from the gitleaks release and
  # checked against the release asset's SHA-256 before it runs (no third-party action, no license key).
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Everything except the MAUI head, which needs the MAUI workload (ADR-0038).
      # Not --locked-mode: some packages resolve per-OS (the RID-specific Aspire dashboard SDK) or
      # per-SDK-patch (Microsoft.NET.ILLink.Tasks), so a lock file committed from one machine cannot
      # satisfy a strict restore on another. The committed lock files still pin versions for local devs.
      - name: Restore
        run: dotnet restore CircleTools.NoMaui.slnx

      - name: Build
        run: dotnet build CircleTools.NoMaui.slnx --no-restore -c Release

      - name: Test
        run: dotnet test CircleTools.NoMaui.slnx --no-build -c Release --verbosity normal

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # DocFX metadata is scoped to the library projects (docfx/docfx.json); restore so its
      # Roslyn workspace can load them. (Not --locked-mode — see the build-test job.)
      - name: Restore
        run: dotnet restore CircleTools.NoMaui.slnx

      - name: Restore local tools (DocFX)
        run: dotnet tool restore

      # Fails on broken links / unresolved xrefs (ADR-0002).
      - name: Build docs site
        run: dotnet docfx docfx/docfx.json

  webauthn-e2e:
    name: webauthn-e2e
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    # Drives the real WebAuthn ceremony in Chromium via a CDP virtual authenticator against the
    # live Aspire stack (arc42 D4, ADR-0045). Kept off the build-test solution on purpose: this
    # project is in CircleTools.slnx but NOT CircleTools.NoMaui.slnx, so the core suite never runs
    # it — it is its own gate here. ubuntu-latest provides the Docker runtime the stack needs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Kestrel needs a certificate to bind https (the fixed-port stack the WASM client calls);
      # Playwright drives the browser with IgnoreHTTPSErrors, so the cert need not be trusted.
      - name: HTTPS dev certificate
        run: dotnet dev-certs https

      # Restores the AppHost and the whole non-MAUI graph the fixture launches at test time.
      - name: Restore
        run: dotnet restore CircleTools.NoMaui.slnx

      # The E2E project lives outside CircleTools.NoMaui.slnx, so build it by path (restores its own
      # reference, CircleTools.Main.Contracts, which the solution restore above already cached).
      - name: Build E2E host
        run: dotnet build tests/E2E/CircleTools.WebAuthn.E2E.Test -c Release

      - name: Install Playwright Chromium
        run: pwsh tests/E2E/CircleTools.WebAuthn.E2E.Test/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: WebAuthn E2E
        run: dotnet test tests/E2E/CircleTools.WebAuthn.E2E.Test -c Release --no-build --verbosity normal

  build-maui:
    name: build-maui
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Install the MAUI workloads this project needs.
      - name: Restore MAUI workloads
        run: dotnet workload restore src/Apps/SecretSanta/CircleTools.SecretSanta.App/CircleTools.SecretSanta.App.csproj

      # Builds only the Android head. The MAUI Windows desktop head is not a shipping target (the suite
      # ships Web + Android + iOS), so CI no longer spends 2x Windows minutes compiling it.
      # iOS/MacCatalyst are macOS-only and built by release-mobile.yml (ADR-0065).
      # No --no-restore / no separate restore step: build runs its own restore.
      - name: Build MAUI Android head
        run: dotnet build src/Apps/SecretSanta/CircleTools.SecretSanta.App/CircleTools.SecretSanta.App.csproj -c Release -f net10.0-android
