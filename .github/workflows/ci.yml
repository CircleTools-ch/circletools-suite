# Continuous integration gate for the CircleTools suite (ADR-0038).
# Build under analyzers (warnings-as-errors), run the full test suite, and build the
# link-checked DocFX site on every push and PR to main. The MAUI head (Android + Windows)
# builds on a Windows runner; iOS is deferred to a future macOS runner (ADR-0031).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Newer pushes to the same branch/PR cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Everything except the MAUI head, which needs the MAUI workload (ADR-0038).
      # Not --locked-mode: some packages resolve per-OS (the RID-specific Aspire dashboard SDK) or
      # per-SDK-patch (Microsoft.NET.ILLink.Tasks), so a lock file committed from one machine cannot
      # satisfy a strict restore on another. The committed lock files still pin versions for local devs.
      - name: Restore
        run: dotnet restore CircleTools.NoMaui.slnx

      - name: Build
        run: dotnet build CircleTools.NoMaui.slnx --no-restore -c Release

      - name: Test
        run: dotnet test CircleTools.NoMaui.slnx --no-build -c Release --verbosity normal

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # DocFX metadata is scoped to the library projects (docfx/docfx.json); restore so its
      # Roslyn workspace can load them. (Not --locked-mode — see the build-test job.)
      - name: Restore
        run: dotnet restore CircleTools.NoMaui.slnx

      - name: Restore local tools (DocFX)
        run: dotnet tool restore

      # Fails on broken links / unresolved xrefs (ADR-0002).
      - name: Build docs site
        run: dotnet docfx docfx/docfx.json

  webauthn-e2e:
    name: webauthn-e2e
    runs-on: ubuntu-latest
    # Drives the real WebAuthn ceremony in Chromium via a CDP virtual authenticator against the
    # live Aspire stack (arc42 D4, ADR-0045). Kept off the build-test solution on purpose: this
    # project is in CircleTools.slnx but NOT CircleTools.NoMaui.slnx, so the core suite never runs
    # it — it is its own gate here. ubuntu-latest provides the Docker runtime the stack needs.
    steps:
      - uses: actions/checkout@v5
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Kestrel needs a certificate to bind https (the fixed-port stack the WASM client calls);
      # Playwright drives the browser with IgnoreHTTPSErrors, so the cert need not be trusted.
      - name: HTTPS dev certificate
        run: dotnet dev-certs https

      # Restores the AppHost and the whole non-MAUI graph the fixture launches at test time.
      - name: Restore
        run: dotnet restore CircleTools.NoMaui.slnx

      # The E2E project lives outside CircleTools.NoMaui.slnx, so build it by path (restores its own
      # reference, CircleTools.Main.Contracts, which the solution restore above already cached).
      - name: Build E2E host
        run: dotnet build tests/E2E/CircleTools.WebAuthn.E2E.Test -c Release

      - name: Install Playwright Chromium
        run: pwsh tests/E2E/CircleTools.WebAuthn.E2E.Test/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: WebAuthn E2E
        run: dotnet test tests/E2E/CircleTools.WebAuthn.E2E.Test -c Release --no-build --verbosity normal

  build-maui:
    name: build-maui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: Nerdbank.GitVersioning (ADR-0047) computes the version from git height, which a
        # shallow clone cannot satisfy — every build in the graph now references nbgv.
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Install the MAUI workloads this project needs (Android + Windows on a Windows runner).
      - name: Restore MAUI workloads
        run: dotnet workload restore src/Apps/SecretSanta/CircleTools.SecretSanta.App/CircleTools.SecretSanta.App.csproj

      # Builds the Android and Windows heads (the TFMs the csproj enables on Windows).
      # iOS/MacCatalyst are macOS-only and deferred to a future macOS runner (ADR-0031).
      # No --no-restore / no separate restore step: the Windows head is RID-specific
      # (<RuntimeIdentifier>win-x64</RuntimeIdentifier>), and its runtime pack is fetched during
      # build, not by `dotnet restore` — so build must run its own restore (NETSDK1112 otherwise).
      - name: Build MAUI heads (Android + Windows)
        run: dotnet build src/Apps/SecretSanta/CircleTools.SecretSanta.App/CircleTools.SecretSanta.App.csproj -c Release
