name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not include real people's names, email addresses or reveal links —
        use made-up examples. Security problems go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a group …
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Web (circletools.ch)
        - Android app
        - iOS app
        - Self-hosted server
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (About & legal), or the container image tag on a self-hosted server.
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [Deutsch, English, Français]
