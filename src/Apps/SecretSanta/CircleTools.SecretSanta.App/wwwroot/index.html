<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CircleTools.SecretSanta.App</title>
    <base href="/" />
    <!-- MudBlazor (ADR-0040); fonts resolve to the system-ui stack set in the MudTheme. -->
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <!-- The suite's slim, framework-agnostic helpers (screen-reader-only utility). -->
    <link rel="stylesheet" href="_content/CircleTools.Ui.Shared/css/circletools.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="CircleTools.SecretSanta.App.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* Pre-boot loading screen. Inlined so it paints on the first frame (no dependency on external
           CSS load order): the WebView shows burgundy (#7a1f2b, matching the native splash) with a
           centred spinner instead of an unstyled white "Loading..." flash. Once Blazor renders the root
           component into #app, the .app-loading child is replaced and disappears; the burgundy html/body
           background is then covered by the app's own surfaces. -->
        html, body { margin: 0; background-color: #7a1f2b; }
        #app { min-height: 100vh; }
        .app-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-color: #7a1f2b; }
        .app-loading__spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: #ffffff; animation: app-loading-spin 0.8s linear infinite; }
        @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app"><div class="app-loading"><div class="app-loading__spinner"></div></div></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/CircleTools.Ui.Shared/js/dateInput.js"></script>

</body>

</html>
