<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#03173d" />
    <!--
        Content-Security-Policy (ADR-0021). The refresh token is readable by script, so the policy
        that keeps injected script off the page is the primary mitigation, not a hardening extra.

        'wasm-unsafe-eval' is mandatory: without it the .NET runtime cannot instantiate its own
        WebAssembly and the app does not start at all. It permits WebAssembly compilation only, not
        eval() or inline script - which is why there is no 'unsafe-inline' in script-src, and why the
        service-worker registration lives in js/app.js instead of a <script> block.

        style-src carries 'unsafe-inline' (ADR-0040): MudBlazor's theme provider emits a dynamic
        inline <style> and its components set inline styles, which a static WASM host cannot nonce
        per request. This relaxes styling only, not script — script-src stays inline-free, so the
        XSS mitigation ADR-0021 relies on is intact. See ADR-0040 for the trade-off.

        connect-src names the API origin explicitly. It is the development one; a deployment serves
        this policy as a response header with its own origin, because a static file cannot know it.
        frame-ancestors is deliberately absent: browsers ignore it in a meta tag and log a warning
        for it, so it belongs in that same header.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'wasm-unsafe-eval';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data:;
                   font-src 'self';
                   connect-src 'self' https://localhost:7180;
                   manifest-src 'self';
                   worker-src 'self';
                   base-uri 'self';
                   form-action 'self';
                   object-src 'none'" />
    <title>CircleTools</title>
    <base href="/" />
    <!-- MudBlazor (ADR-0040). Fonts resolve to the system-ui stack set in the MudTheme, so no
         external font is loaded (CSP-friendly). -->
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <!-- The suite's slim, framework-agnostic helpers (screen-reader-only utility). -->
    <link rel="stylesheet" href="_content/CircleTools.Ui.Shared/css/circletools.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CircleTools.Main.WebApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
