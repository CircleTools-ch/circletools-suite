# Loki single-binary config (ADR-0051): filesystem storage, ~30d retention, native OTLP ingestion for
# the API's structured logs (the app exports OTLP logs here — see ServiceDefaults). Internal only:
# never published; Grafana (also internal) queries it. Logs land at POST /otlp/v1/logs.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Required for OTLP log ingestion (OTel resource/scope attributes ride as structured metadata).
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# No phone-home.
analytics:
  reporting_enabled: false
