# CircleTools production stack (ADR-0036): one small VPS, Docker Compose, self-managed Postgres.
# Federated suite (ADR-0046): one Caddy serves both WASM PWAs and proxies the API on separate origins.
#
# Local build:   docker compose -f deploy/compose.yaml --env-file deploy/.env build
# Deploy on VM:  docker compose pull && docker compose up -d      (images from GHCR; ADR-0038 CD)
# Migrate first: docker compose run --rm migrator                 (explicit release step)
#
# Every service reads secrets from deploy/.env (see .env.example). No secret is baked into an image.

name: circletools

x-images:
  # Pull-based deploy on the VM uses these; `build:` is for producing/pushing them (CI or local).
  api: &api-image ghcr.io/circletools-ch/circletools-api:${IMAGE_TAG:-latest}
  web: &web-image ghcr.io/circletools-ch/circletools-web:${IMAGE_TAG:-latest}

# Log rotation for the json-file driver (ADR-0051): the local `docker compose logs` floor cannot grow
# unbounded and fill the NVMe. The API additionally ships its structured logs to Loki over OTLP, but
# this keeps every container's stdout readable on the box even when Grafana/Loki is down.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: maindb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d maindb"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port: only the API (same network) reaches Postgres.

  # One-shot: applies EF Core migrations for all four contexts, then exits (ADR-0036 explicit step).
  migrator:
    image: *api-image
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__maindb: ${ConnectionStrings__maindb}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *api-image
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Names this service in telemetry. Without it the OTel SDK falls back to "unknown_service:dotnet"
      # (in dev, Aspire's AppHost injects this per service; the production container has no AppHost, so
      # it must be set here). Loki surfaces it as the `service_name` label used to filter logs.
      OTEL_SERVICE_NAME: circletools-main-api
      # Observability (ADR-0051): ship structured logs to Loki over OTLP; metrics are scraped from
      # /metrics by Prometheus (pull), so no metrics endpoint is configured here. Not a secret.
      # The FULL signal path (/otlp/v1/logs) is required: the .NET OTLP/HTTP exporter uses the endpoint
      # as-is when set programmatically — it does NOT append /v1/logs, so a bare /otlp 404s at Loki.
      Observability__LokiOtlpEndpoint: http://loki:3100/otlp/v1/logs
      # Secrets — from deploy/.env, never committed.
      ConnectionStrings__maindb: ${ConnectionStrings__maindb}
      Auth__Jwt__SigningKey: ${Auth__Jwt__SigningKey}
      Mail__Username: ${Mail__Username}
      Mail__Password: ${Mail__Password}
      # Fail-closed at-rest crypto keys (ADR-0061 share tokens, ADR-0062 email HMAC). The endpoints that
      # use them throw "not configured" if these are absent — so they MUST be passed through here, not
      # just present in .env.
      SharedGroups__Security__TokenEncryptionKey: ${SharedGroups__Security__TokenEncryptionKey}
      Circles__Security__EmailHashKey: ${Circles__Security__EmailHashKey}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/alive || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No published port: Caddy reverse-proxies to api:8080 on the internal network.

  web:
    image: *web-image
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      # The ntfy site name in the Caddyfile (ADR-0091); must match NTFY_BASE_URL on the ntfy service.
      NTFY_HOST: ${NTFY_HOST:-ntfy.circletools.ch}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    depends_on:
      - api
      - grafana
      - ntfy
    volumes:
      # Persist issued certificates and ACME state across restarts.
      - caddy_data:/data
      - caddy_config:/config

  # --- Observability stack (ADR-0051): self-hosted Loki + Prometheus + Grafana ---------------------
  # All three stay on the internal Docker network; only Grafana is reverse-proxied by Caddy
  # (grafana.circletools.ch), behind its own login. Prometheus and Loki are never published.

  # Log store — receives the API's structured logs over OTLP (POST :3100/otlp/v1/logs).
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No published port: only the API (logs) and Grafana (queries) reach Loki on the internal network.

  # Metrics store — SCRAPES the API's internal /metrics endpoint (see prometheus.yml). 30d retention.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    # No published port: only Grafana reaches Prometheus on the internal network.

  # Admin UI — datasources auto-provisioned (Prometheus + Loki). Reached via Caddy at
  # grafana.circletools.ch, behind Grafana's own admin login.
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.circletools.ch
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # No anonymous access; sign-up disabled — admin login only.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Alert email (ADR-0088): Grafana sends through the same Brevo SMTP relay as the API and the backup
      # alert. ALERT_EMAIL_TO is read by grafana/provisioning/alerting/mail-capacity.yaml. It is required:
      # Grafana refuses to start with an empty contact-point address, so compose fails first, before a
      # deploy pulls or changes anything.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp-relay.brevo.com:587
      GF_SMTP_USER: ${Mail__Username}
      GF_SMTP_PASSWORD: ${Mail__Password}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:-no-reply@circletools.ch}
      GF_SMTP_FROM_NAME: CircleTools Alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO in deploy/.env (ADR-0088)}
      # Push alerts and the watchdog (ADR-0091), read by grafana/provisioning/alerting/notifications.yaml.
      # Required for the same reason as ALERT_EMAIL_TO: an empty webhook URL or credential stops Grafana.
      # Grafana posts to ntfy over the internal network (http://ntfy), so push alerts do not depend on
      # Caddy, DNS or the certificate.
      NTFY_GRAFANA_TOKEN: ${NTFY_GRAFANA_TOKEN:?set NTFY_GRAFANA_TOKEN in deploy/.env (ADR-0091)}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:?set HEALTHCHECKS_PING_URL in deploy/.env (ADR-0091)}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - ntfy
    # No published port: Caddy reverse-proxies grafana:3000 (deploy/Caddyfile).

  # Push notifications to the owner's phone (ADR-0091) — the alert channel independent of Brevo. Shared
  # operations infrastructure: CircleTools' alerts and the owner's private senders publish here. Users,
  # access and tokens come from deploy/.env (single-quoted there, because bcrypt hashes contain dollar
  # signs); the static settings are in ntfy/server.yml. Reached via Caddy at ntfy.circletools.ch.
  ntfy:
    image: binwiederhier/ntfy:v2.32.0
    restart: unless-stopped
    logging: *default-logging
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://${NTFY_HOST:-ntfy.circletools.ch}
      NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:?set NTFY_AUTH_USERS in deploy/.env (ADR-0091)}
      NTFY_AUTH_ACCESS: ${NTFY_AUTH_ACCESS:?set NTFY_AUTH_ACCESS in deploy/.env (ADR-0091)}
      NTFY_AUTH_TOKENS: ${NTFY_AUTH_TOKENS:?set NTFY_AUTH_TOKENS in deploy/.env (ADR-0091)}
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No published port: Caddy reverse-proxies ntfy:80, and Grafana publishes to it internally.

  # Host metrics (CPU / RAM / disk / filesystem / network / load) — reads the host through read-only
  # mounts; Prometheus scrapes it at node-exporter:9100. Not published.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      # Only report real filesystems (skip the container/pseudo mounts). $$ escapes $ for compose.
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run)($$|/)"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave

  # Per-container metrics (CPU / memory / network) — so the API vs Postgres vs the observability stack's
  # own footprint is visible on the shared box. Prometheus scrapes it at cadvisor:8080. Not published.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  loki_data:
  prometheus_data:
  grafana_data:
  ntfy_data:
